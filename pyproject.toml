[project]
name = "training-free-hmc"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "lightgbm>=4",
    "torch>=2.5",
    "tabpfn==9.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tfhmc = "tfhmc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfhmc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
